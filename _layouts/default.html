<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1016" />
    <meta name="description" content="{{ page.description | default: site.description | escape }}" />
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="icon" href="{{ '/assets/web_images/favicon.ico' | relative_url }}" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/css/colores.css' | relative_url }}" />
    {% feed_meta %}
  </head>
  <body class="page-{{ page.layout | default: 'default' }}">
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <div class="site-shell">
      {% include header.html %}
      <main id="main" class="site-main">{{ content }}</main>
      {% include footer.html %}
      <dialog class="image-lightbox" id="image-lightbox" aria-labelledby="lightbox-caption">
        <div class="image-lightbox__frame">
          <button class="image-lightbox__close" type="button" aria-label="Cerrar imagen ampliada">×</button>
          <img class="image-lightbox__image" src="" alt="" />
          <p class="image-lightbox__caption" id="lightbox-caption"></p>
        </div>
      </dialog>
    </div>
    <script>
      const imageLightbox = document.getElementById('image-lightbox');
      const lightboxImage = imageLightbox?.querySelector('.image-lightbox__image');
      const lightboxCaption = imageLightbox?.querySelector('.image-lightbox__caption');
      const closeLightbox = imageLightbox?.querySelector('.image-lightbox__close');

      const openImageLightbox = (image) => {
        if (!imageLightbox || !lightboxImage || !lightboxCaption || !imageLightbox.showModal) return;
        lightboxImage.src = image.currentSrc || image.src;
        lightboxImage.alt = image.alt || 'Captura ampliada del writeup';
        lightboxCaption.textContent = image.alt || 'Captura del writeup';
        imageLightbox.showModal();
      };

      document.addEventListener('click', (event) => {
        const image = event.target instanceof Element && event.target.closest('.post-content-image');
        if (image) openImageLightbox(image);
      });

      document.addEventListener('keydown', (event) => {
        const image = event.target;
        if ((event.key === 'Enter' || event.key === ' ') && image.matches?.('.post-content-image')) {
          event.preventDefault();
          openImageLightbox(image);
        }
      });

      closeLightbox?.addEventListener('click', () => imageLightbox.close());
      imageLightbox?.addEventListener('click', (event) => {
        if (event.target === imageLightbox) imageLightbox.close();
      });
    </script>
  </body>
</html>
